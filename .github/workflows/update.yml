name: Update Haze Watch

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 UTC (GitHub may start it a few minutes late)
  workflow_dispatch:       # "Run workflow" button for a manual refresh
  push:
    branches: [main]
    paths: ["site/**", "pipeline/**", "config.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: haze-watch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the forecast
        env:
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pipeline/run.py

      - name: Save history for the forecast check
        run: |
          git config user.name "haze-watch-bot"
          git config user.email "haze-watch-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Hourly data $(date -u +%Y-%m-%dT%H:00Z)"
          git push || (git pull --rebase && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
