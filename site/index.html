<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haze Watch</title>
<meta name="description" content="Haze outlook for your places: air quality now, the next hours, the best time to be outdoors, and where the smoke is coming from.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Haze Watch">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1d3557">
<meta name="format-detection" content="telephone=no">
<style>
/* Layout: Weather-style. iPhone: one place at a time, swipe or use the bottom bar; animated sky behind frosted cards.
   iPad (>= 900px): places sidebar on the left, two-column card grid on the right. */
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
  --round: ui-rounded, -apple-system, "SF Pro Rounded", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --fg:#ffffff; --fg-2:rgba(255,255,255,.72); --fg-3:rgba(255,255,255,.5);
  --glass:rgba(22,30,46,.26); --glass-strong:rgba(18,24,38,.55); --hair:rgba(255,255,255,.16);
  --b0:#3d9df5; --b1:#4cd27a; --b2:#ffd23f; --b3:#ff9a3c; --b4:#ff4f4f;
  --ember:#ff7a3d; --smoke:#d9c7b4; --wind:#9fd8ff;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.4,.64,1);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;background:#1d3557}
body{margin:0;font-family:var(--font);color:var(--fg);font-size:16px;line-height:1.35;overflow-x:hidden;background:#1d3557;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:10px}
a{color:#fff}

/* ---------- animated sky ---------- */
#sky{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.sky-layer{position:absolute;inset:0;transition:opacity 1.1s var(--ease)}
#sun{position:absolute;width:46vmin;height:46vmin;border-radius:50%;left:62%;top:-6vmin;filter:blur(2px);transition:opacity 1.2s var(--ease), background 1.2s var(--ease), transform 1.2s var(--ease)}
#haze{position:absolute;inset:0;width:100%;height:100%}

/* ---------- shell ---------- */
.app{position:relative;z-index:1;min-height:100%;display:grid;grid-template-columns:1fr}
.sidebar{display:none}
.detail{min-width:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.detail-inner{max-width:760px;margin:0 auto}

/* ---------- hero ---------- */
.hero{text-align:center;padding:42px 8px 26px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.hero-loc{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--fg-2);text-transform:uppercase}
.hero-place{font-size:34px;font-weight:400;letter-spacing:.005em;margin-top:2px;text-shadow:0 1px 12px rgba(0,0,0,.18)}
.hero-num{font-family:var(--font);font-weight:200;font-size:112px;line-height:1;letter-spacing:-.04em;margin:2px 0 0;font-variant-numeric:tabular-nums;text-shadow:0 2px 24px rgba(0,0,0,.15)}
.hero-num small{font-size:20px;font-weight:500;letter-spacing:.02em;vertical-align:top;position:relative;top:18px;margin-left:4px;color:var(--fg-2)}
.hero-band{font-size:22px;font-weight:500;margin-top:2px}
.hero-sub{font-size:17px;color:var(--fg-2);margin-top:4px;text-wrap:balance}
.hero-src{display:inline-block;margin-top:10px;font-size:12.5px;font-weight:600;color:var(--fg-2);background:rgba(0,0,0,.14);border:.5px solid var(--hair);border-radius:999px;padding:4px 11px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.hero-src:empty{display:none}
.hero-dots{display:none;justify-content:center;gap:7px;margin-top:14px}
.hero-dots i{width:7px;height:7px;border-radius:50%;background:var(--fg-3);transition:background .3s, transform .3s var(--spring)}
.hero-dots i.on{background:#fff;transform:scale(1.15)}
.hero.swap{animation:heroIn .55s var(--ease)}
@keyframes heroIn{from{opacity:.25;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- banner ---------- */
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:18px;padding:13px 15px;margin-bottom:12px;background:rgba(120,40,20,.38);border:.5px solid rgba(255,170,120,.35);-webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4)}
.banner svg{flex-shrink:0;margin-top:1px}
.banner b{display:block;font-size:15px}
.banner span{font-size:14px;color:var(--fg-2)}

/* ---------- cards ---------- */
.cards{display:grid;grid-template-columns:1fr;gap:12px}
.card{position:relative;border-radius:18px;background:var(--glass);border:.5px solid var(--hair);-webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5);padding:12px 15px 15px;min-width:0;overflow:hidden;animation:cardIn .6s var(--ease) both}
.card:nth-child(2){animation-delay:.04s}.card:nth-child(3){animation-delay:.08s}.card:nth-child(4){animation-delay:.12s}.card:nth-child(5){animation-delay:.16s}.card:nth-child(n+6){animation-delay:.2s}
@keyframes cardIn{from{opacity:.001;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.card-h{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-3);padding-bottom:9px;margin-bottom:10px;border-bottom:.5px solid var(--hair)}
.card-h .grow{flex:1}
.card-h svg{width:15px;height:15px;flex-shrink:0}
.big{font-size:30px;font-weight:600;line-height:1.05;font-family:var(--round)}
.lead{font-size:17px;font-weight:500;line-height:1.3}
.muted{color:var(--fg-2);font-size:14.5px}
.tiny{color:var(--fg-3);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 9px;background:rgba(255,255,255,.14)}
.pill i{width:8px;height:8px;border-radius:50%}

/* hourly */
.hours{display:flex;gap:2px;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -15px;padding:0 9px 2px;scrollbar-width:none}
.hours::-webkit-scrollbar{display:none}
.hr{flex:0 0 56px;display:grid;justify-items:center;gap:7px;scroll-snap-align:start;padding:2px 0}
.hr .t{font-size:14px;font-weight:600}
.hr .t.now{font-weight:700}
.ring{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid currentColor;opacity:.95}
.ring .fill{width:12px;height:12px;border-radius:50%;background:currentColor}
.hr .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.hr .s{height:12px;display:flex;align-items:center}

/* best time */
.day-row{display:grid;gap:7px;margin-top:4px}
.day-row + .day-row{margin-top:14px}
.day-row .lbl{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.day-row .lbl b{font-weight:600}
.strip{position:relative;display:grid;grid-template-columns:repeat(12,1fr);gap:2px;height:22px}
.strip span{border-radius:4px;transform-origin:bottom;animation:grow .7s var(--spring) both}
@keyframes grow{from{transform:scaleY(.15);opacity:.3}to{transform:none;opacity:1}}
.strip .win{position:absolute;top:-4px;bottom:-4px;border:2px solid #fff;border-radius:7px;box-shadow:0 0 0 3px rgba(0,0,0,.12);transition:left .5s var(--ease), width .5s var(--ease)}
.strip-ticks{display:flex;justify-content:space-between;font-size:11.5px;color:var(--fg-3)}

/* days */
.days{display:grid}
.dr{display:grid;grid-template-columns:62px 22px 34px 1fr 34px;align-items:center;gap:8px;padding:9px 0;border-top:.5px solid var(--hair)}
.dr:first-child{border-top:0;padding-top:2px}
.dr .n{font-size:17px;font-weight:500}
.dr .lo{color:var(--fg-2);text-align:right;font-variant-numeric:tabular-nums;font-size:16px}
.dr .hi{text-align:left;font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.track{position:relative;height:5px;border-radius:3px;background:rgba(255,255,255,.14)}
.track .range{position:absolute;top:0;bottom:0;border-radius:3px;transform-origin:left;animation:widen .8s var(--ease) both}
@keyframes widen{from{transform:scaleX(0)}to{transform:none}}
.track .nowdot{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.35)}

/* map */
.mapwrap{position:relative;margin:0 -15px -15px;cursor:pointer}
.mapwrap svg{display:block;width:100%;height:auto}
.mapbar{position:absolute;left:12px;right:12px;bottom:10px;display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:12px;background:var(--glass-strong);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.mapbar .prog{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.2);overflow:hidden}
.mapbar .prog i{display:block;height:100%;width:0;background:#fff;border-radius:2px;transition:width .4s linear}
.expand{display:inline-flex;align-items:center;gap:4px;color:var(--fg-2);text-transform:none;letter-spacing:0;font-weight:600;font-size:13px}
.smoke-g{transition:opacity .45s ease}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.75}100%{transform:scale(2.6);opacity:0}}
.head{transition:cx .45s linear, cy .45s linear}


/* forecast vs readings */
.cmp-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--fg-2);margin:10px 0 4px}
.cmp-legend span{display:inline-flex;align-items:center;gap:6px}
.cmp{position:relative;margin:0 -6px;touch-action:pan-y}
.cmp svg{display:block;width:100%;height:auto;overflow:visible}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s var(--spring) both}
@keyframes pop{from{transform:scale(0)}to{transform:none}}
.fadein{animation:fade .9s ease .9s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.tip{position:absolute;top:0;transform:translateX(-50%);pointer-events:none;background:rgba(14,20,32,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:.5px solid var(--hair);border-radius:10px;padding:5px 9px;font-size:12px;line-height:1.35;white-space:nowrap;font-variant-numeric:tabular-nums}
.tip b{font-weight:700}

/* source */
.srcbars{display:grid;gap:8px;margin-top:12px}
.srcbar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14.5px}
.srcbar .bar{grid-column:1/-1;height:6px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.srcbar .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--smoke),var(--ember));transform-origin:left;animation:widen .9s var(--ease) both}

/* wind */
.wind{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.compass{width:124px;height:124px}
.needle{transform-origin:62px 62px;transition:transform 1.2s var(--spring)}
.windrow{display:flex;gap:10px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.windrow::-webkit-scrollbar{display:none}
.wr{display:grid;justify-items:center;gap:3px;font-size:12px;color:var(--fg-2);flex:0 0 40px}
.wr svg{transition:transform .8s var(--spring)}

/* fires & check */
.firerows{display:grid;gap:7px;margin-top:12px}
.fr{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:14.5px}
.fr .bar{grid-column:1/-1;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.fr .bar i{display:block;height:100%;border-radius:3px;background:var(--ember);transform-origin:left;animation:widen .9s var(--ease) both}
.check{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums}
.check td,.check th{padding:7px 0;border-top:.5px solid var(--hair);text-align:right}
.check th{font-weight:600;color:var(--fg-3);font-size:12px;text-transform:uppercase;letter-spacing:.04em;border-top:0}
.check td:first-child,.check th:first-child{text-align:left}
.about p{margin:0 0 9px;font-size:14.5px;color:var(--fg-2)}
.about p:last-child{margin:0}
.about b{color:#fff;font-weight:600}
.foot{text-align:center;font-size:12.5px;color:var(--fg-3);padding:18px 8px 8px;display:grid;gap:6px;justify-items:center}
.foot button{font-weight:600;color:#fff;background:rgba(255,255,255,.16);border-radius:999px;padding:8px 16px;font-size:14px}

/* ---------- bottom bar (iPhone) ---------- */
.toolbar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));background:rgba(16,22,34,.42);border-top:.5px solid var(--hair);-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5)}
.toolbar button{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}
.toolbar .dots{display:flex;gap:8px}
.toolbar .dots i{width:7px;height:7px;border-radius:50%;background:var(--fg-3);transition:background .3s, transform .3s var(--spring)}
.toolbar .dots i.on{background:#fff;transform:scale(1.2)}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);display:flex;flex-direction:column;
  background:rgba(22,28,42,.86);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);border-radius:22px 22px 0 0;border-top:.5px solid var(--hair);
  transform:translateY(105%);transition:transform .5s var(--ease);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet.on{transform:none}
@media (min-width:900px){ .sheet{left:50%;right:auto;width:min(860px,94vw);bottom:auto;top:50%;border-radius:22px;border:.5px solid var(--hair);transform:translate(-50%,-46%) scale(.96);opacity:0;pointer-events:none;transition:transform .45s var(--ease),opacity .3s ease}
  .sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto} }
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:2px auto 8px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sheet-h h2{margin:0;font-size:20px;font-weight:700}
.close{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center}
.sheet-body{overflow:auto;-webkit-overflow-scrolling:touch;min-height:0}
#mapSlot svg{display:block;width:100%;height:auto;border-radius:14px}
.scrub{display:flex;align-items:center;gap:12px;margin:12px 0 8px}
.play{width:40px;height:40px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;flex-shrink:0}
.scrub input{flex:1;accent-color:#fff;height:30px}
.when{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;min-width:12ch;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--fg-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

/* places list (sheet on iPhone, sidebar on iPad) */
.plist{display:grid;gap:10px}
.ptile{position:relative;display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;border-radius:16px;padding:12px 14px;overflow:hidden;min-height:92px;border:.5px solid var(--hair);transition:transform .2s var(--ease)}
.ptile:active{transform:scale(.98)}
.ptile .bg{position:absolute;inset:0;z-index:0}
.ptile > *:not(.bg){position:relative;z-index:1}
.ptile .pn{font-size:20px;font-weight:700;line-height:1.15}
.ptile .pv{grid-row:span 2;font-size:44px;font-weight:300;line-height:1;align-self:center;font-variant-numeric:tabular-nums}
.ptile .ps{font-size:14px;color:var(--fg-2)}
.ptile .pb{grid-column:1/-1;font-size:13px;color:var(--fg-2);margin-top:6px}
.ptile.sel{box-shadow:0 0 0 2px #fff inset}

@media (min-width:900px){
  .app{grid-template-columns:330px 1fr}
  .sidebar{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 22px) 14px 22px max(16px,env(safe-area-inset-left,0px));background:rgba(10,14,24,.28);border-right:.5px solid var(--hair);-webkit-backdrop-filter:blur(28px) saturate(1.4);backdrop-filter:blur(28px) saturate(1.4)}
  .sidebar h1{font-size:30px;font-weight:700;margin:0 4px 14px}
  .sidebar .tiny{margin:14px 4px 0}
  .detail{padding-bottom:32px}
  .detail-inner{max-width:980px}
  .cards{grid-template-columns:1fr 1fr;align-items:start}
  .card.wide{grid-column:1/-1}
  .toolbar,.hero-dots{display:none}
  .hero{padding-top:56px}
  .hero-num{font-size:128px}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div id="sky" aria-hidden="true">
  <div class="sky-layer" id="skyA"></div><div class="sky-layer" id="skyB" style="opacity:0"></div>
  <div id="sun"></div>
  <canvas id="haze"></canvas>
</div>

<div class="app">
  <aside class="sidebar" aria-label="Places">
    <h1>Haze Watch</h1>
    <div class="plist" id="sideList"></div>
    <div class="tiny" id="sideUpdated"></div>
  </aside>

  <main class="detail">
    <div class="detail-inner">
      <header class="hero" id="hero" aria-live="polite">
        <div class="hero-loc"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 3 3 10.5l7.2 2.3L12.5 20z"/></svg><span id="heroLoc">Air quality now</span></div>
        <div class="hero-place" id="heroPlace">Haze Watch</div>
        <div class="hero-num" id="heroNum">--<small>API</small></div>
        <div class="hero-band" id="heroBand">Loading the latest forecast</div>
        <div class="hero-sub" id="heroSub"></div>
        <div class="hero-src" id="heroSrc"></div>
        <div class="hero-dots" id="heroDots"></div>
      </header>
      <div id="banner"></div>
      <section class="cards" id="cards"></section>
      <div class="foot" id="foot"></div>
    </div>
  </main>
</div>

<nav class="toolbar" aria-label="App">
  <button type="button" id="tbMap" aria-label="Haze map"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg></button>
  <div class="dots" id="tbDots" role="tablist" aria-label="Places"></div>
  <button type="button" id="tbList" aria-label="All places"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor"/></svg></button>
</nav>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheetMap" role="dialog" aria-modal="true" aria-labelledby="mapTitle">
  <div class="grab"></div>
  <div class="sheet-h"><h2 id="mapTitle">Haze map</h2><button class="close" type="button" data-close aria-label="Close"><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8"/></svg></button></div>
  <div class="sheet-body">
    <div id="mapSlot"></div>
    <div class="scrub"><button class="play" type="button" id="play" aria-label="Play"><svg id="playIcon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg></button><input type="range" id="t" min="0" max="24" step="1" value="0" aria-label="Forecast hour"><span class="when" id="when"></span></div>
    <div class="legend"><span><i style="background:var(--ember)"></i>Fire, last 24h</span><span><i style="background:#ffb878;opacity:.6"></i>24–48h ago</span><span><i style="background:var(--smoke);opacity:.7;border-radius:3px"></i>Tracked smoke</span><span><i style="background:var(--wind);border-radius:2px;height:3px;width:14px"></i>Wind at 1.5 km</span><span><i style="background:var(--b1);border-radius:2px"></i>Station</span></div>
  </div>
</section>
<section class="sheet" id="sheetList" role="dialog" aria-modal="true" aria-labelledby="listTitle">
  <div class="grab"></div>
  <div class="sheet-h"><h2 id="listTitle">Places</h2><button class="close" type="button" data-close aria-label="Close"><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8"/></svg></button></div>
  <div class="sheet-body"><div class="plist" id="sheetPlaces"></div></div>
</section>

<script>
'use strict';
/* ================= data helpers ================= */
const H = 3600e3, MYT = 8*H;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], DAYFULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'], MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const myt = ms => new Date(ms + MYT);
const hh = ms => { const d = myt(ms); let h = d.getUTCHours(); const ap = h < 12 ? 'am' : 'pm'; h = h % 12 || 12; return h + ap; };
const hhmm = ms => { const d = myt(ms); let h = d.getUTCHours(); const ap = h < 12 ? 'am' : 'pm'; h = h % 12 || 12; const m = d.getUTCMinutes(); return h + (m ? ':' + String(m).padStart(2,'0') : '') + ap; };
const dayName = ms => { const d = myt(ms); return DOW[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MON[d.getUTCMonth()]; };
const regionName = r => r === 'Other' ? 'other areas' : r;
const compass = deg => ['N','NE','E','SE','S','SW','W','NW'][Math.round(((deg % 360) + 360) % 360 / 45) % 8];
const COMPASS_WORD = {N:'north',NE:'north-east',E:'east',SE:'south-east',S:'south',SW:'south-west',W:'west',NW:'north-west'};

// PM2.5 -> approximate Malaysian API (breakpoints to be confirmed against DOE guidance)
function api(pm){ if (pm == null) return null;
  if (pm <= 15) return pm/15*50; if (pm <= 35) return 50 + (pm-15)/20*50;
  if (pm <= 150) return 100 + (pm-35)/115*100; if (pm <= 250) return 200 + (pm-150);
  return 300 + (pm-250)/250*200; }
const BANDS = [
  {max:50,  name:'Good',           verdict:'Good to go outside',                  c:'var(--b0)'},
  {max:100, name:'Moderate',       verdict:'Fine for most. Take care if sensitive', c:'var(--b1)'},
  {max:200, name:'Unhealthy',      verdict:'Move outdoor plans indoors',          c:'var(--b2)'},
  {max:300, name:'Very unhealthy', verdict:'Stay in with windows shut',           c:'var(--b3)'},
  {max:1e9, name:'Hazardous',      verdict:'Stay in with windows shut',           c:'var(--b4)'}];
const bandOf = a => a == null ? 0 : BANDS.findIndex(b => a <= b.max);
const smokeCat = s => s < 20 ? 0 : s < 100 ? 1 : s < 250 ? 2 : 3;
const SMOKE = ['No smoke','Light smoke','Moderate smoke','Heavy smoke'];

// Sky palettes by band [top, bottom] — day and night
const SKY_DAY   = [['#2e78cc','#7fbaea'],['#4a7fae','#a7c3cc'],['#6f7b80','#c3a17a'],['#6d4f3d','#c78549'],['#4a2a24','#9a5434']];
const SKY_NIGHT = [['#0a1a35','#24426e'],['#13233a','#3c566a'],['#1f2328','#584837'],['#26190f','#5c3922'],['#1b0d0b','#482216']];

let D = null, GEO = null, NOW = 0, A = [], SEL = 0, SCMAX = 60;
const idx = k => NOW + (k - 24) * H;            // series index -> time (index 24 = now)
const sameDay = (a, b) => myt(a).getUTCDate() === myt(b).getUTCDate();
const when = ms => hhmm(ms) + (sameDay(ms, NOW) ? '' : ' tomorrow');

function bestWindow(p, off){
  const d = myt(NOW); const mid = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - MYT + off*24*H;
  let best = null;
  for (let h = 7; h <= 16; h++){ const start = mid + h*H, k = 24 + Math.round((start - NOW)/H);
    if (k < 24 || k + 2 >= p.pm.length) continue; const v = p.pm.slice(k, k+3); if (v.some(x => x == null)) continue;
    const m = (v[0]+v[1]+v[2])/3; if (!best || m < best.m) best = {start, m, k}; }
  return best;
}
function analyse(p){
  const nowApi = api(p.pm[24]), nb = bandOf(nowApi);
  let peakK = 25; for (let k = 25; k < 49; k++) if (p.pm[k] > p.pm[peakK]) peakK = k;
  const peakApi = api(p.pm[peakK]), pb = bandOf(peakApi);
  const sCat = smokeCat(Math.max(...p.sc.slice(25,49)));
  let arrive = null; for (let k = 25; k < 49; k++) if (p.sc[k] >= 100) { arrive = k; break; }
  let conf = 'Medium';
  if ((sCat >= 2 && pb >= 1) || (sCat <= 1 && pb <= 1)) conf = 'High';
  if ((sCat === 3 && pb === 0) || (sCat === 0 && pb >= 2)) conf = 'Low';
  const obsApi = p.obs && p.obs.pm != null ? api(p.obs.pm) : null;
  const camsNow = api((p.cams || p.pm)[24]);
  return {nowApi, nb, peakK, peakApi, pb, sCat, arrive, conf, obsApi, camsNow};
}

function sourceText(p, short){
  const o = p.obs;
  if (!o || o.pm == null) return short ? 'Forecast only' : 'Forecast only. No monitoring station within 25 km.';
  const kind = o.type === 'sensor' ? 'Local sensor' : 'DOE station';
  if (short) return kind + ' ' + o.km + ' km';
  let s = kind + ' · ' + (o.station || 'nearby') + ' · ' + o.km + ' km';
  if (o.shared > 0) s += ' · shared with ' + o.shared + ' other place' + (o.shared > 1 ? 's' : '');
  return s;
}

/* ================= sky & haze animation ================= */
let skyFront = 'A', hazeTarget = {n:20, alpha:.2, u:1, v:0, warm:0};
function isNight(){ const h = myt(NOW || Date.now()).getUTCHours(); return h < 7 || h >= 19; }
function setSky(band){
  const pal = (isNight() ? SKY_NIGHT : SKY_DAY)[band];
  const back = skyFront === 'A' ? $('#skyB') : $('#skyA'), front = skyFront === 'A' ? $('#skyA') : $('#skyB');
  back.style.background = 'linear-gradient(180deg,' + pal[0] + ' 0%,' + pal[1] + ' 100%)';
  back.style.opacity = 1; front.style.opacity = 0; skyFront = skyFront === 'A' ? 'B' : 'A';
  document.documentElement.style.background = pal[0];
  document.querySelector('meta[name=theme-color]').setAttribute('content', pal[0]);
  const sun = $('#sun'), night = isNight();
  const sunCol = night ? 'radial-gradient(circle, rgba(220,230,255,.35) 0%, rgba(220,230,255,0) 62%)' :
    ['radial-gradient(circle, rgba(255,250,225,.95) 0%, rgba(255,240,190,.35) 32%, rgba(255,240,190,0) 64%)',
     'radial-gradient(circle, rgba(255,246,215,.8) 0%, rgba(255,235,185,.28) 34%, rgba(255,235,185,0) 64%)',
     'radial-gradient(circle, rgba(255,214,150,.75) 0%, rgba(255,190,120,.25) 36%, rgba(255,190,120,0) 64%)',
     'radial-gradient(circle, rgba(255,170,100,.7) 0%, rgba(240,140,80,.22) 38%, rgba(240,140,80,0) 64%)',
     'radial-gradient(circle, rgba(240,120,70,.6) 0%, rgba(200,90,50,.2) 40%, rgba(200,90,50,0) 64%)'][band];
  sun.style.background = sunCol; sun.style.opacity = night ? .6 : 1 - band*0.12;
  sun.style.transform = 'translateY(' + (band*3) + 'vmin)';
}
const haze = $('#haze'), hctx = haze.getContext('2d');
let blobs = [], hazeRaf = 0, lastT = 0;
function sizeHaze(){ const r = Math.min(2, devicePixelRatio || 1); haze.width = innerWidth * r; haze.height = innerHeight * r; hctx.setTransform(r,0,0,r,0,0); }
function seedBlobs(){ const W = innerWidth, Hh = innerHeight; blobs = [];
  for (let i = 0; i < 70; i++) blobs.push({x:Math.random()*W, y:Hh*(.25 + Math.random()*.85), r:80 + Math.random()*220, a:Math.random(), s:.5 + Math.random()}); }
function drawHaze(t){
  const dt = Math.min(50, t - (lastT || t)); lastT = t;
  const W = innerWidth, Hh = innerHeight; hctx.clearRect(0,0,W,Hh);
  const n = Math.round(hazeTarget.n), warm = hazeTarget.warm;
  const col = warm > .5 ? [214,170,120] : warm > 0 ? [205,190,170] : [235,240,250];
  for (let i = 0; i < n && i < blobs.length; i++){ const b = blobs[i];
    b.x += hazeTarget.u * b.s * dt * .012; b.y -= hazeTarget.v * b.s * dt * .006;
    if (b.x - b.r > W) b.x = -b.r; if (b.x + b.r < 0) b.x = W + b.r; if (b.y - b.r > Hh*1.2) b.y = Hh*.2; if (b.y + b.r < Hh*.15) b.y = Hh*1.1;
    const g = hctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    const a = hazeTarget.alpha * (.35 + .65*b.a);
    g.addColorStop(0, 'rgba(' + col + ',' + a.toFixed(3) + ')'); g.addColorStop(1, 'rgba(' + col + ',0)');
    hctx.fillStyle = g; hctx.beginPath(); hctx.arc(b.x, b.y, b.r, 0, 6.2832); hctx.fill(); }
  if (!REDUCED && document.visibilityState === 'visible') hazeRaf = requestAnimationFrame(drawHaze);
}
function setHaze(band, wd){
  const dirTo = ((wd ? wd[0] : 200) + 180) * Math.PI/180, sp = wd ? Math.max(1, wd[1]) : 3;
  hazeTarget = {n:[10,22,40,55,70][band], alpha:[.05,.09,.15,.2,.24][band], u:Math.sin(dirTo)*sp/3, v:Math.cos(dirTo)*sp/3, warm:band >= 3 ? 1 : band >= 2 ? .4 : 0};
  if (REDUCED){ drawHaze(performance.now()); return; }
  cancelAnimationFrame(hazeRaf); hazeRaf = requestAnimationFrame(drawHaze);
}
let rsT = 0; addEventListener('resize', () => { sizeHaze(); if (REDUCED) drawHaze(performance.now()); clearTimeout(rsT); rsT = setTimeout(() => { if (D) drawCompare(); }, 150); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !REDUCED){ cancelAnimationFrame(hazeRaf); lastT = 0; hazeRaf = requestAnimationFrame(drawHaze); } });
sizeHaze(); seedBlobs();

/* ================= hero ================= */
let shownNum = null;
function countTo(el, to){
  const from = shownNum == null ? to : shownNum; shownNum = to;
  if (REDUCED || from === to){ el.firstChild.nodeValue = to; return; }
  const t0 = performance.now(), dur = 650;
  const step = t => { const k = Math.min(1, (t - t0)/dur), e = 1 - Math.pow(1-k, 3); el.firstChild.nodeValue = Math.round(from + (to-from)*e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function renderHero(){
  const p = D.places[SEL], a = A[SEL], b = BANDS[a.nb];
  const hero = $('#hero'); hero.classList.remove('swap'); void hero.offsetWidth; hero.classList.add('swap');
  $('#heroLoc').textContent = 'Air quality now · ' + hh(NOW);
  $('#heroSrc').textContent = sourceText(p, false);
  $('#heroPlace').textContent = p.name;
  countTo($('#heroNum'), Math.round(a.nowApi));
  $('#heroBand').textContent = b.name;
  const peakTxt = a.peakApi > a.nowApi + 3 ? (a.pb > a.nb ? 'Rising to ' : 'Peaking near ') + Math.round(a.peakApi) + ' around ' + when(idx(a.peakK)) : (() => { const lo = Math.min(...p.pm.slice(25, 49).filter(v => v != null).map(api)); return lo < a.nowApi - 10 ? 'Easing to about ' + Math.round(lo) + ' over the next day' : 'Holding near this level today'; })();
  const stTxt = a.obsApi != null && Math.abs(a.obsApi - a.camsNow) >= 10 ? ' The forecast alone said ' + Math.round(a.camsNow) + '.' : '';
  $('#heroSub').textContent = b.verdict + '. ' + peakTxt + '.' + stTxt;
  const dots = D.places.map((_, i) => '<i class="' + (i === SEL ? 'on' : '') + '"></i>').join('');
  $('#heroDots').innerHTML = dots;
  $('#tbDots').innerHTML = D.places.map((q, i) => '<i class="' + (i === SEL ? 'on' : '') + '" role="tab" aria-selected="' + (i === SEL) + '" aria-label="' + esc(q.name) + '"></i>').join('');
  setSky(a.nb); setHaze(a.nb, p.wd && p.wd[0]);
  const ban = a.sCat >= 2 && a.arrive ? '<div class="banner" role="status">' + ICON.smoke(20) + '<div><b>' + SMOKE[a.sCat] + ' arriving</b><span>Fires in ' + esc(p.srcs.map(s => regionName(s[0])).join(' and ') || 'the region') + ', reaching ' + esc(p.name) + ' from about ' + when(idx(a.arrive)) + '.</span></div></div>' : '';
  $('#banner').innerHTML = ban;
}

/* ================= icons (SF Symbols style) ================= */
const ICON = {
  clock: s => '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  sun: s => '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  cal: s => '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  map: s => '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg>',
  smoke: s => '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 16c2-2 4 2 6 0s4 2 6 0 3 1 4 0"/><path d="M4 11c2-2 4 2 6 0s4 2 6 0 3 1 4 0" opacity=".7"/><path d="M6 6c1.5-1.5 3 1.5 4.5 0S13.5 7.5 15 6" opacity=".45"/></svg>',
  flame: s => '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-3-1-6 1-9z"/></svg>',
  wind: s => '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h8"/></svg>',
  pin: s => '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>',
  check: s => '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>',
  info: s => '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
  chart: s => '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 4-7 5 6"/><circle cx="8" cy="11" r="1.3" fill="currentColor"/><circle cx="16" cy="7" r="1.3" fill="currentColor"/></svg>',
  chev: s => '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>'
};
const card = (cls, icon, title, body, extra) => '<article class="card ' + cls + '"><div class="card-h">' + ICON[icon](15) + '<span class="grow">' + title + '</span>' + (extra || '') + '</div>' + body + '</article>';

/* ================= cards ================= */
function hourlyCard(p, a){
  let h = '';
  for (let k = 24; k <= 48; k++){ const v = p.pm[k]; if (v == null) continue; const ap = api(v), b = BANDS[bandOf(ap)];
    const smoke = p.sc[k] >= 100 ? '<span class="s" title="Fire smoke tracked" style="color:var(--smoke)">' + ICON.smoke(14) + '</span>' : '<span class="s"></span>';
    h += '<div class="hr"><span class="t' + (k === 24 ? ' now' : '') + '">' + (k === 24 ? 'Now' : hh(idx(k))) + '</span><span class="ring" style="color:' + b.c + '"><span class="fill"></span></span><span class="v">' + Math.round(ap) + '</span>' + smoke + '</div>'; }
  const next = a.pb > a.nb ? 'Worsening to ' + BANDS[a.pb].name.toLowerCase() + ' around ' + when(idx(a.peakK)) + '.' : a.pb < a.nb ? 'Improving to ' + BANDS[a.pb].name.toLowerCase() + ' later.' : 'Staying ' + BANDS[a.nb].name.toLowerCase() + ', peaking near ' + Math.round(a.peakApi) + ' around ' + when(idx(a.peakK)) + '.';
  return card('wide', 'clock', 'Next 24 hours', '<p class="muted" style="margin:0 0 12px">' + esc(next) + '</p><div class="hours">' + h + '</div>');
}
function compareCard(p, a){
  const obsN = (p.obsHist || []).filter(v => v != null).length;
  let msg;
  if (!D.meta.stationsUsed) msg = 'Add your WAQI token to plot real station readings against the forecast.';
  else if (a.obsApi == null) msg = 'No monitoring station within 40 km, so only the forecast is shown.';
  else { const gap = Math.round(a.obsApi - a.camsNow);
    msg = (p.obs && p.obs.type === 'sensor' ? 'The local sensor reads ' : 'The nearest DOE station reads ') + Math.round(a.obsApi) + (Math.abs(gap) < 10 ? ', close to the forecast.' : ', ' + Math.abs(gap) + (gap > 0 ? ' above' : ' below') + ' the forecast.');
    const adj = adjusted(p); if (adj && Math.abs(gap) >= 10){ let pk = 24; for (let k = 25; k <= 48; k++) if (adj[k] != null && adj[k] > (adj[pk] ?? -1)) pk = k;
      msg += ' Adjusted for that gap, the next 24 hours peak near ' + Math.round(api(adj[pk])) + ' around ' + when(idx(pk)) + '.'; }
    if (obsN < 6) msg += ' Readings build up hourly; ' + obsN + ' so far.'; }
  const legend = '<div class="cmp-legend"><span><svg width="18" height="8"><path d="M1 4h16" stroke="#fff" stroke-width="2"/></svg>Forecast</span>' +
    (a.obsApi != null || obsN ? '<span><svg width="12" height="12"><circle cx="6" cy="6" r="4" fill="#64d2ff"/></svg>Station reading</span>' : '') +
    (a.obsApi != null ? '<span><svg width="18" height="8"><path d="M1 4h16" stroke="#64d2ff" stroke-width="2" stroke-dasharray="4 3"/></svg>Forecast adjusted to station</span>' : '') + '</div>';
  return card('wide', 'chart', 'Forecast and readings', '<p class="lead" style="margin:0">' + esc(msg) + '</p>' + legend + '<div class="cmp" id="cmp"></div>' +
    '<p class="tiny" style="margin:6px 0 0">Past 24 hours and next 24 hours, approximate API. ' + esc(sourceText(p, false)) + '.' + (p.obs && p.obs.anchor ? ' Nearest DOE station (' + esc(p.obs.anchor.station) + ', ' + p.obs.anchor.km + ' km) reads ' + Math.round(api(p.obs.anchor.pm)) + '.' : '') + '</p>');
}
// forecast shifted by the current station gap, fading out over about 12 hours
function adjusted(p){
  const c = p.cams || p.pm, o = p.obs && p.obs.pm != null ? p.obs.pm : null; if (o == null || c[24] == null) return null;
  const gap = o - c[24]; const out = [];
  for (let k = 0; k <= 48; k++) out.push(k < 24 || c[k] == null ? null : Math.max(0, c[k] + gap * Math.exp(-(k - 24)/12)));
  return out;
}
function drawCompare(){
  const host = document.getElementById('cmp'); if (!host) return;
  const p = D.places[SEL], a = A[SEL];
  const W = Math.max(300, Math.round(host.clientWidth || 340)), Hh = innerWidth >= 900 ? 230 : 200, L = 18, R = W - 34, T = 12, B = Hh - 24;
  const f = (p.cams || p.pm).slice(0, 49).map(v => v == null ? null : api(v));
  const ob = (p.obsHist || []).map(v => v == null ? null : api(v));
  if (a.obsApi != null) ob[24] = a.obsApi;
  const adjPm = adjusted(p), ad = adjPm ? adjPm.map(v => v == null ? null : api(v)) : null;
  const all = [...f, ...ob, ...(ad || [])].filter(v => v != null);
  const ymax = Math.max(120, Math.ceil(Math.max(...all) * 1.12 / 25) * 25);
  const X = k => L + k/48*(R - L), Y = v => B - v/ymax*(B - T);
  let s = '';
  const edges = [0,50,100,200,300,500];
  for (let b = 0; b < 5; b++){ const lo = edges[b], hi = Math.min(edges[b+1], ymax); if (lo >= ymax) break;

  for (let i = 0; i < ni; i++) for (let j = 0; j < nj; j++){ const ix = (i*nj + j)*2; if (ix + 1 >= wv.length) continue;
    const u = wv.charCodeAt(ix) - 77, v = wv.charCodeAt(ix+1) - 77, lat = G.lat0 + 2*i, lon = G.lon0 + 2*j;
    if (lon < 95.5 || lon > 119.5 || lat < -6.5 || lat > 7.5) continue; const sp = Math.hypot(u, v); if (sp < .5) continue;
    const L = Math.min(32, 6 + sp*3), x = PX(lon), y = PY(lat), dx = u/sp*L, dy = -v/sp*L;
    w += '<line x1="' + (x-dx/2).toFixed(1) + '" y1="' + (y-dy/2).toFixed(1) + '" x2="' + (x+dx/2).toFixed(1) + '" y2="' + (y+dy/2).toFixed(1) + '" stroke="#9fd8ff" stroke-width="1.5" opacity=".7" marker-end="url(#ah)"/>'; }
  document.getElementById('windG').innerHTML = w;
  document.querySelectorAll('.head').forEach(c => { const t = D.tracks[+c.dataset.i]; const p = t.pts[Math.min(f, t.pts.length-1)]; c.setAttribute('cx', PX(p[1]).toFixed(1)); c.setAttribute('cy', PY(p[0]).toFixed(1)); });
  const k = 24 + f*3, shown = [];
  document.getElementById('placesG').innerHTML = D.places.map((p, i) => { const b = BANDS[bandOf(api(p.pm[k]))], x = PX(p.lon), y = PY(p.lat), sel = i === SEL;
    const crowded = shown.some(q => Math.hypot(q[0]-x, q[1]-y) < 40); if (!crowded || sel) shown.push([x, y]);
    return (sel ? '<circle cx="' + x + '" cy="' + y + '" r="14" fill="none" stroke="#fff" stroke-width="2"/>' : '') + '<circle cx="' + x + '" cy="' + y + '" r="7.5" fill="' + b.c + '" stroke="#0f2236" stroke-width="2"/>' +
      ((crowded && !sel) ? '' : '<text x="' + (x+11) + '" y="' + (y-7) + '" font-family="-apple-system,system-ui,sans-serif" font-size="14" font-weight="700" fill="#fff" stroke="#0f2236" stroke-width="3" paint-order="stroke">' + esc(p.name) + '</text>'); }).join('');
  const ms = NOW + f*3*H, label = f === 0 ? 'Now' : hh(ms) + ' ' + DOW[myt(ms).getUTCDay()];
  const bar = document.getElementById('mapLabel'); if (bar) bar.textContent = label;
  const prog = document.getElementById('mapProg'); if (prog) prog.style.width = (f/24*100) + '%';
  $('#when').textContent = (f === 0 ? 'Now' : '+' + f*3 + 'h') + ' · ' + hh(ms) + ' ' + DOW[myt(ms).getUTCDay()];
  $('#t').value = f;
}
function mapCard(){
  return card('wide', 'map', 'Haze map', '<div class="mapwrap" id="mapWrap" role="button" tabindex="0" aria-label="Open the haze map"><div id="mapHome">' + buildMap() + '</div><div class="mapbar"><span id="mapLabel">Now</span><span class="prog"><i id="mapProg"></i></span><span>+72h</span></div></div>', '<span class="expand">Open ' + ICON.chev(12) + '</span>');
}
function autoplay(on){
  clearInterval(mapTimer); mapTimer = null;
  if (!on || REDUCED) return;
  let pause = 0;
  mapTimer = setInterval(() => { if (!mapVisible && !sheetPlaying) return; if (pause > 0){ pause--; return; }
    let f = mapFrame + 1; if (f > 24){ f = 0; pause = 3; } drawFrame(f);
    if (sheetPlaying && f === 24){ sheetPlaying = false; setPlayIcon(); autoplay(!sheetOpen('sheetMap')); } }, 480);
}

/* ================= places list ================= */
function tileHTML(p, i){
  const a = A[i], b = BANDS[a.nb], pal = SKY_DAY[a.nb];
  return '<button class="ptile' + (i === SEL ? ' sel' : '') + '" type="button" data-pick="' + i + '"><span class="bg" style="background:linear-gradient(160deg,' + pal[0] + ',' + pal[1] + ')"></span><span class="pn">' + esc(p.name) + '</span><span class="pv">' + Math.round(a.nowApi) + '</span><span class="ps">' + b.name + '</span><span class="pb">Peak ' + Math.round(a.peakApi) + ' around ' + esc(when(idx(a.peakK))) + ' · ' + esc(sourceText(p, true)) + (p.obs && p.obs.shared > 0 ? ' (shared)' : '') + '</span></button>';
}
function renderLists(){
  const html = D.places.map(tileHTML).join('');
  $('#sideList').innerHTML = html; $('#sheetPlaces').innerHTML = html;
  const gen = Date.parse(D.meta.generated);
  $('#sideUpdated').textContent = 'Updated ' + dayName(gen) + ', ' + hhmm(gen) + '. Refreshes every hour.';
}

/* ================= render ================= */
function renderCards(){
  const p = D.places[SEL], a = A[SEL];
  const mapHtml = mapCard();
  $('#cards').innerHTML = hourlyCard(p, a) + compareCard(p, a) + bestCard(p) + daysCard(p, a) + mapHtml + sourceCard(p, a) + windCard(p) + firesCard() + checkCard() + aboutCard();
  drawCompare();
  if (!REDUCED) requestAnimationFrame(() => requestAnimationFrame(() => { const n = document.getElementById('needle'); if (n) n.style.transform = 'rotate(' + ((p.wd[0][0] + 180) % 360) + 'deg)'; }));
  smokeFront = 0; drawFrame(mapFrame);
  const wrap = $('#mapWrap');
  wrap.addEventListener('click', openMap); wrap.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openMap(); } });
  if ('IntersectionObserver' in window){ const io = new IntersectionObserver(es => { mapVisible = es[0].isIntersecting; }, {threshold:.2}); io.observe(wrap); }
  const gen = Date.parse(D.meta.generated), age = Math.round((Date.now() - gen)/60000);
  $('#foot').innerHTML = '<span>' + (age > 150 ? 'Data is ' + Math.round(age/60) + ' hours old. ' : '') + 'Updated ' + dayName(gen) + ', ' + hhmm(gen) + '</span><button type="button" id="refresh">Refresh</button><span>NASA FIRMS · Open-Meteo with Copernicus CAMS data (CC BY 4.0) · WAQI · Natural Earth</span><span>API bands use approximate PM2.5 breakpoints pending DOE confirmation.</span>';
  $('#refresh').addEventListener('click', () => load(true));
}
function select(i, fromSwipe){
  if (!D) return; SEL = (i + D.places.length) % D.places.length;
  try { localStorage.setItem('hw-place', D.places[SEL].id); } catch (e) {}
  renderHero(); renderCards(); renderLists();
  if (!fromSwipe) scrollTo({top:0, behavior: REDUCED ? 'auto' : 'smooth'});
}
function render(){
  D.places.forEach(p => { if (!p.cams){ p.cams = p.pm; if (p.est) p.pm = p.est; } });
  NOW = Date.parse(D.meta.nowISO); A = D.places.map(analyse); SCMAX = Math.max(60, ...D.places.map(p => Math.max(...p.sc)));
  try { const id = localStorage.getItem('hw-place'); const i = D.places.findIndex(p => p.id === id); if (i >= 0) SEL = i; } catch (e) {}
  if (SEL >= D.places.length) SEL = 0;
  renderHero(); renderCards(); renderLists(); autoplay(true);
}

/* ================= sheets ================= */
const sheetOpen = id => document.getElementById(id).classList.contains('on');
function openSheet(id){ $('#scrim').classList.add('on'); document.getElementById(id).classList.add('on'); }
function closeSheets(){ document.querySelectorAll('.sheet.on').forEach(s => s.classList.remove('on')); $('#scrim').classList.remove('on');
  const svg = $('#mapSlot svg'); if (svg){ if ($('#mapHome svg')) svg.remove(); else $('#mapHome').appendChild(svg); } sheetPlaying = false; setPlayIcon(); autoplay(true); }
function openMap(){ const svg = $('#mapHome svg'); if (svg) $('#mapSlot').appendChild(svg); autoplay(false); openSheet('sheetMap'); }
function setPlayIcon(){ $('#playIcon').innerHTML = sheetPlaying ? '<path d="M4 2.5h3v11H4zM9 2.5h3v11H9z"/>' : '<path d="M4 2.5v11l9-5.5z"/>'; $('#play').setAttribute('aria-label', sheetPlaying ? 'Pause' : 'Play'); }
$('#play').addEventListener('click', () => { sheetPlaying = !sheetPlaying; setPlayIcon(); if (sheetPlaying){ if (mapFrame >= 24) drawFrame(0); autoplay(true); } else autoplay(false); });
$('#t').addEventListener('input', e => { sheetPlaying = false; setPlayIcon(); autoplay(false); drawFrame(+e.target.value); });
$('#scrim').addEventListener('click', closeSheets);
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeSheets));
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheets(); });
$('#tbMap').addEventListener('click', openMap);
$('#tbList').addEventListener('click', () => openSheet('sheetList'));
document.addEventListener('click', e => { const t = e.target.closest('[data-pick]'); if (!t) return; select(+t.dataset.pick); if (sheetOpen('sheetList')) closeSheets(); });
// swipe down on a sheet's grabber area closes it
document.querySelectorAll('.sheet').forEach(sh => { let y0 = null;
  sh.addEventListener('touchstart', e => { const r = sh.getBoundingClientRect(); y0 = e.touches[0].clientY - r.top < 60 ? e.touches[0].clientY : null; }, {passive:true});
  sh.addEventListener('touchmove', e => { if (y0 == null) return; const dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transition = 'none'; sh.style.transform = innerWidth < 900 ? 'translateY(' + dy + 'px)' : ''; }, {passive:true});
  sh.addEventListener('touchend', e => { if (y0 == null) return; const dy = e.changedTouches[0].clientY - y0; sh.style.transition = ''; sh.style.transform = ''; y0 = null; if (dy > 90) closeSheets(); }); });
// swipe between places on iPhone
(function(){ let x0 = null, y0 = null; const el = $('.detail');
  el.addEventListener('touchstart', e => { if (innerWidth >= 900) return; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  el.addEventListener('touchend', e => { if (x0 == null || e.target.closest('.hours,.windrow,.mapwrap')) { x0 = null; return; }
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 70 && Math.abs(dy) < 50) select(SEL + (dx < 0 ? 1 : -1), true); }, {passive:true}); })();

/* ================= load ================= */
async function load(force){
  const btn = $('#refresh'); if (btn){ btn.disabled = true; btn.textContent = 'Refreshing…'; }
  try {
    const [d, g] = await Promise.all([
      fetch('data/latest.json' + (force ? '?t=' + Date.now() : ''), {cache: force ? 'reload' : 'default'}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
      GEO ? Promise.resolve(GEO) : fetch('geo.json').then(r => r.json())]);
    D = d; GEO = g; render();
  } catch (e) {
    if (!D){ $('#heroBand').textContent = 'Could not load the forecast'; $('#heroSub').textContent = 'Check your connection, then pull down or reopen the app.'; }
  } finally { const b = $('#refresh'); if (b){ b.disabled = false; b.textContent = 'Refresh'; } }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && D && Date.now() - Date.parse(D.meta.generated) > 50*60e3) load(true); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
setSky(1); setHaze(1, null);
load(false);
</script>
